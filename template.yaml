# =============================================================================
# CloudPulse - Infrastructure as Code (AWS SAM, which expands into CloudFormation)
#
# One `sam deploy` creates everything below; `sam delete` removes it again.
# Every resource was chosen and sized to stay inside the AWS *Always Free* limits:
#   Lambda (1M requests/month), DynamoDB (25 RCU / 25 WCU provisioned), SNS (1,000 emails),
#   EventBridge Scheduler (14M invocations), CloudFront (1 TB, 10M requests),
#   CloudWatch (10 custom metrics, 10 alarms, 3 dashboards).
# Deliberately NOT used because they cost money: NAT Gateway, EC2, RDS, ElastiCache,
# Secrets Manager, customer-managed KMS keys, WAF, DynamoDB auto scaling.
# =============================================================================
AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: CloudPulse - serverless uptime and latency monitoring (free-tier friendly)

Parameters:
  AlertEmail:
    Type: String
    Description: Email that receives DOWN / RECOVERED alerts. AWS sends a confirmation email first - click the link in it.
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    ConstraintDescription: Must be a valid email address.
  AdminPasswordParameter:
    Type: String
    Default: /cloudpulse/admin-password
    Description: Name of the SSM Parameter Store SecureString holding the admin password (create it before deploying).
  CheckSchedule:
    Type: String
    Default: rate(5 minutes)
    Description: How often EventBridge Scheduler runs the checker.
  ScheduleState:
    Type: String
    Default: ENABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: Set to DISABLED to pause all checks without deleting anything.

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64] # Graviton: cheaper per ms and the free tier applies the same way
    MemorySize: 256
    CodeUri: dist/lambda/ # produced by `npm run build:lambda` (esbuild bundles)
    Environment:
      Variables:
        TABLE_NAME: !Ref Table
        TOPIC_ARN: !Ref AlertTopic
        ADMIN_PASSWORD_PARAM: !Ref AdminPasswordParameter

Resources:
  # ---------------------------------------------------------------------------
  # Database: one DynamoDB table (single-table design, see backend/lib/db.ts)
  # ---------------------------------------------------------------------------
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      # PROVISIONED (not on-demand) because the Always Free tier covers 25 RCU + 25 WCU of
      # provisioned capacity. 10 + 10 is plenty for 10 monitors checked every 5 minutes.
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 10
        WriteCapacityUnits: 10
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      # Items with an "expiresAt" timestamp in the past are deleted automatically, at no cost.
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # ---------------------------------------------------------------------------
  # Alerts: SNS topic with an email subscription
  # ---------------------------------------------------------------------------
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: CloudPulse
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  # ---------------------------------------------------------------------------
  # Compute: two Lambda functions
  # ---------------------------------------------------------------------------
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /cloudpulse/${AWS::StackName}/api
      RetentionInDays: 7 # old logs are deleted so storage never grows

  CheckerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /cloudpulse/${AWS::StackName}/checker
      RetentionInDays: 7

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: CloudPulse HTTP API (status page, login, monitor CRUD, run-now)
      Handler: api.handler
      Timeout: 29 # API Gateway waits at most 30 seconds for an answer
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      # Least privilege: SAM policy templates expand into IAM policies scoped to these resources only.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AlertTopic.TopicName
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AdminPasswordParameter}
      Events:
        GetStatus:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /api/status }
        Login:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /api/login }
        ListMonitors:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /api/monitors }
        CreateMonitor:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /api/monitors }
        GetMonitor:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: "/api/monitors/{id}" }
        DeleteMonitor:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: DELETE, Path: "/api/monitors/{id}" }
        CheckNow:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /api/check-now }

  CheckerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: CloudPulse scheduled checker (runs every 5 minutes)
      Handler: checker.handler
      Timeout: 60 # checks run in parallel with a 10 s timeout each, so this is generous
      LoggingConfig:
        LogGroup: !Ref CheckerLogGroup
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AlertTopic.TopicName
      Events:
        EveryFiveMinutes:
          Type: ScheduleV2 # EventBridge Scheduler
          Properties:
            Description: Run all CloudPulse uptime checks
            ScheduleExpression: !Ref CheckSchedule
            State: !Ref ScheduleState
            RetryPolicy:
              MaximumRetryAttempts: 0 # the next run is only 5 minutes away anyway

  # ---------------------------------------------------------------------------
  # API: API Gateway HTTP API (cheaper and simpler than a REST API)
  # ---------------------------------------------------------------------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Description: CloudPulse API (reached through CloudFront at /api/*)
      # Throttling = rate limiting. Requests above this are rejected with HTTP 429 before
      # they reach Lambda, which protects both the app and the free-tier limits.
      DefaultRouteSettings:
        ThrottlingRateLimit: 10 # steady requests per second
        ThrottlingBurstLimit: 20 # short bursts allowed above the steady rate

  # ---------------------------------------------------------------------------
  # Website: private S3 bucket served through CloudFront (CDN)
  # ---------------------------------------------------------------------------
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Fully private: only CloudFront can read it (see the bucket policy below).
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  WebsiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-website
        Description: Lets CloudFront sign its requests to the private website bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Statement:
          - Sid: AllowOnlyOurCloudFrontDistribution
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${WebsiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: CloudPulse website + API
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100 # cheapest edge locations (North America + Europe)
        Origins:
          - Id: website
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebsiteOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: "" # empty because we use the newer OAC instead
          - Id: api
            DomainName: !Sub ${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        # Default: static website files from S3, cached at the edge.
        DefaultCacheBehavior:
          TargetOriginId: website
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
        CacheBehaviors:
          # Public status data: cached at the edge for the 60 s the Lambda allows
          # (Cache-Control: s-maxage=60), so most visitors never reach Lambda or DynamoDB.
          - PathPattern: /api/status
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          # Everything else under /api: never cached, all methods, all headers forwarded.
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader

  # ---------------------------------------------------------------------------
  # Observability: CloudWatch dashboard + one alarm
  # ---------------------------------------------------------------------------
  CheckerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-checker-errors
      AlarmDescription: The CloudPulse checker Lambda is failing - the monitor itself needs attention.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref CheckerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub ${AWS::StackName}-dashboard
      DashboardBody: !Sub |
        {
          "widgets": [
            { "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": { "title": "Monitors up / down", "region": "${AWS::Region}", "view": "timeSeries",
                "stat": "Maximum", "period": 300,
                "metrics": [ ["CloudPulse", "MonitorsUp", "Service", "CloudPulse"],
                             ["CloudPulse", "MonitorsDown", "Service", "CloudPulse"] ] } },
            { "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": { "title": "Average check latency (ms)", "region": "${AWS::Region}", "view": "timeSeries",
                "stat": "Average", "period": 300,
                "metrics": [ ["CloudPulse", "AvgLatencyMs", "Service", "CloudPulse"] ] } },
            { "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": { "title": "Lambda invocations and errors", "region": "${AWS::Region}", "view": "timeSeries",
                "stat": "Sum", "period": 300,
                "metrics": [ ["AWS/Lambda", "Invocations", "FunctionName", "${CheckerFunction}", { "label": "Checker invocations" }],
                             ["AWS/Lambda", "Errors", "FunctionName", "${CheckerFunction}", { "label": "Checker errors" }],
                             ["AWS/Lambda", "Invocations", "FunctionName", "${ApiFunction}", { "label": "API invocations" }],
                             ["AWS/Lambda", "Errors", "FunctionName", "${ApiFunction}", { "label": "API errors" }] ] } },
            { "type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": { "title": "Lambda duration (ms)", "region": "${AWS::Region}", "view": "timeSeries",
                "stat": "Average", "period": 300,
                "metrics": [ ["AWS/Lambda", "Duration", "FunctionName", "${CheckerFunction}", { "label": "Checker" }],
                             ["AWS/Lambda", "Duration", "FunctionName", "${ApiFunction}", { "label": "API" }] ] } },
            { "type": "metric", "x": 0, "y": 12, "width": 12, "height": 6,
              "properties": { "title": "API Gateway requests", "region": "${AWS::Region}", "view": "timeSeries",
                "stat": "Sum", "period": 300,
                "metrics": [ ["AWS/ApiGateway", "Count", "ApiId", "${HttpApi}", { "label": "Requests" }],
                             ["AWS/ApiGateway", "4xx", "ApiId", "${HttpApi}", { "label": "4xx (incl. 429 throttled)" }],
                             ["AWS/ApiGateway", "5xx", "ApiId", "${HttpApi}", { "label": "5xx" }] ] } },
            { "type": "metric", "x": 12, "y": 12, "width": 12, "height": 6,
              "properties": { "title": "DynamoDB consumed capacity (units per 5 min)", "region": "${AWS::Region}", "view": "timeSeries",
                "stat": "Sum", "period": 300,
                "metrics": [ ["AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${Table}", { "label": "Reads" }],
                             ["AWS/DynamoDB", "ConsumedWriteCapacityUnits", "TableName", "${Table}", { "label": "Writes" }] ] } }
          ]
        }

Outputs:
  SiteUrl:
    Description: Open this in your browser
    Value: !Sub https://${Distribution.DomainName}
  WebsiteBucketName:
    Description: S3 bucket that holds the built website (used by scripts/deploy.sh)
    Value: !Ref WebsiteBucket
  DistributionId:
    Description: CloudFront distribution id (used to invalidate the cache after a deploy)
    Value: !Ref Distribution
  TableName:
    Description: DynamoDB table (used by `npm run seed`)
    Value: !Ref Table
  ApiEndpoint:
    Description: Direct API Gateway URL (normally you go through CloudFront instead)
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  CheckerFunctionName:
    Description: Scheduled checker Lambda
    Value: !Ref CheckerFunction
  AlertTopicArn:
    Description: SNS topic for alerts
    Value: !Ref AlertTopic
  DashboardUrl:
    Description: CloudWatch dashboard
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/${Dashboard}
