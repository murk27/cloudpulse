# Continuous Integration: every push and pull request is linted, type-checked, tested and built,
# and the AWS template is validated. Nothing is deployed from here: deploying needs AWS
# credentials, which we keep on the developer's machine (see README -> "What I'd do next").
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit + integration tests
        run: npm test

      - name: Build website and Lambda bundles
        run: npm run build

      - name: Validate the SAM / CloudFormation template
        run: pipx run cfn-lint template.yaml
