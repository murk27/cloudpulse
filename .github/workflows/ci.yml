# Continuous Integration: every push and pull request is linted, type-checked, tested and built.
# Deployment (CD) is done by Vercel's Git integration: every push to main deploys to production,
# and every other branch / pull request gets its own preview URL.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit + integration tests
        run: npm test

      - name: Build the website
        run: npm run build
